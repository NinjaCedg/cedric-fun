/* Precise Alignment for Figma-style Cards */
.drawflow-node .input,

width: 14px !important;

height: 14px !important;

border: 3px solid #2563eb !important;

top: 65% !important;

.drawflow .connection .main-path {

/* Animation 1: Moving Dashes (Flow effect) */

    from { stroke-dashoffset: 100; }
    to { stroke-dashoffset: 0; }

<script>
function validateJSONata(expression) {
    const statusEl = $("jsonataStatus");
    if (!expression || expression.trim() === "($)") {
        statusEl.innerText = "DEFAULT";
        statusEl.className = "ms-2 badge rounded-pill bg-secondary";
        return;
    }

    try {
        // This only 'parses' the AST, it doesn't execute against data
        jsonata(expression); 
        statusEl.innerText = "VALID";
        statusEl.className = "ms-2 badge rounded-pill bg-success";
    } catch (e) {
        // e.position gives the column where the syntax error is
        statusEl.innerText = `INVALID: ${e.message.split(':')[0]}`;
        statusEl.className = "ms-2 badge rounded-pill bg-danger";
        console.warn("JSONata Syntax Error:", e);
    }
}




function notify(message, type = 'info') {
    const toastEl = document.getElementById('liveToast');
    const toastMsg = document.getElementById('toastMessage');
    
    // Change color based on type
    toastEl.classList.remove('bg-dark', 'bg-success', 'bg-danger', 'bg-primary');
    if (type === 'success') toastEl.classList.add('bg-success');
    else if (type === 'error') toastEl.classList.add('bg-danger');
    else if (type === 'process') toastEl.classList.add('bg-primary');
    else toastEl.classList.add('bg-dark');

    toastMsg.innerText = message;
    const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
    toast.show();
}

$("exportBtn").onclick = () => {
    const rawData = editor.export().drawflow.Home.data;
    const nodes = [];
    const links = [];

    // Transform Drawflow format back to your Schema format
    Object.keys(rawData).forEach(id => {
        const node = rawData[id];
        const d = node.data;
        
        // Reconstruction logic based on node type
        let resolver = {};
        if (d.apiCall) {
            resolver = { inline: { apiCall: d.apiCall } };
        } else if (d.isScriptOnly) {
            resolver = { inline: { script: { code: d.transformer, language: d.language || "JSONATA" } } };
        } else {
            resolver = { 
                inline: { 
                    aiPrompt: { 
                        promptTemplate: d.prompt, 
                        responseFormat: { json: { schema: d.schema } } 
                    } 
                },
                inputTransformer: { code: d.transformer || "($)" }
            };
        }

        nodes.push({
            id: d.nodeId || d.id || `node_${id}`,
            resolver: resolver,
            executionMode: d.executionMode || "EXECUTION_MODE_IMMEDIATE"
        });

        // Capture Links
        node.outputs.output_1.connections.forEach(conn => {
            const targetNode = rawData[conn.node].data;
            links.push({
                fromNodeId: d.nodeId || d.id,
                toNodeId: targetNode.nodeId || targetNode.id
            });
        });
    });

    const exportData = { nodes, links };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agent-flow-export-${new Date().getTime()}.json`;
    a.click();
};

async function runFullSimulation(rootInput) {
    const nodesData = editor.export().drawflow.Home.data;
    const totalNodes = Object.keys(nodesData).length;
    let globalContext = JSON.parse(JSON.stringify(rootInput));
    const executed = new Set();
    const finalResultsMap = {}; // Storage for individual node outputs

    // 1. Initialize Progress Bar UI
    const pContainer = $("pipelineProgressContainer");
    const pBar = $("pipelineProgressBar");
    if (pContainer && pBar) {
        pContainer.style.display = "block";
        pBar.style.width = "0%";
        pBar.style.background = "var(--primary)";
    }

    // 2. Reset UI Trays
    document.querySelectorAll('.node-result-tray').forEach(el => el.innerHTML = "");

    // 3. Initial Log Entry
    $("logContent").innerHTML = `
        <div class="log-entry" style="border-left-color: #f59e0b">
            <div class="log-title">Pipeline Start</div>
            <span class="log-label">Root Context</span>
            <code class="log-code">${JSON.stringify(globalContext, null, 2)}</code>
        </div>`;

    // 4. Execution Loop
    while (executed.size < totalNodes) {
        const readyNodes = Object.keys(nodesData).filter(id =>
            !executed.has(id) &&
            nodesData[id].inputs.input_1.connections.every(c => executed.has(c.node.toString()))
        );

        if (!readyNodes.length) break;

        const snapshot = JSON.parse(JSON.stringify(globalContext));
        const levelResults = [];

        for (const id of readyNodes) {
            const nodeEl = document.getElementById('node-' + id);
            nodeEl.classList.add('running');
            const d = nodesData[id].data;
            const nodeName = d.nodeId || id;
            
            try {
                // Prepare Input Mapping via JSONata
                const payload = await jsonata(d.transformer || "($)").evaluate(snapshot);
                let resultData;

                // --- BRANCH 1: API CALL ---
                if (d.apiCall) {
                    const http = d.apiCall.http;
                    const gasProxyUrl = "https://script.google.com/a/macros/qover.com/s/AKfycbw0qpBe7Vgl-XW2VPgeJU63UD3J1NRo12THkKyLSFqjOni1Rczk4hgEtE4pdvq7zfKH3Q/exec";

                    const response = await fetch(gasProxyUrl, {
                        method: "POST",
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            url: http.url,
                            method: "POST",
                            headers: http.headers,
                            payload: payload
                        })
                    });

                    const text = await response.text();
                    resultData = JSON.parse(text);

                    nodeEl.querySelector('.node-result-tray').innerText = JSON.stringify(resultData, null, 2);
                    nodeEl.classList.replace('running', 'completed');

                    $("logContent").innerHTML += `
                        <div class="log-entry" style="border-left-color: #3b82f6;">
                            <div class="log-title">API Call @${nodeName}</div>
                            <span class="log-label">Response</span>
                            <code class="log-code">${text}</code>
                        </div>`;
                }
                // --- BRANCH 2: LOGIC/SCRIPT ONLY ---
                else if (d.isScriptOnly) {
                    const scriptCode = d.resolver?.inline?.script?.code || d.scriptCode;
                    resultData = await jsonata(scriptCode).evaluate(payload);

                    nodeEl.querySelector('.node-result-tray').innerText = JSON.stringify(resultData, null, 2);
                    nodeEl.classList.replace('running', 'completed');

                    $("logContent").innerHTML += `
                        <div class="log-entry" style="border-left-color: #6366f1;">
                            <div class="log-title">Logic Node @${nodeName}</div>
                            <code class="log-code">${JSON.stringify(resultData, null, 2)}</code>
                        </div>`;
                }
                // --- BRANCH 3: STANDARD AI AGENT ---
                else {
                    const renderedPrompt = d.prompt.replace(/\{\{(.*?)\}\}/g, (m, e) => {
                        try { return new Function(...Object.keys(payload), `return ${e}`)(...Object.values(payload)); } catch { return m; }
                    });

                    const aiRes = await callAI(renderedPrompt, d.schema);
                    resultData = JSON.parse(aiRes);

                    nodeEl.querySelector('.node-result-tray').innerText = JSON.stringify(resultData, null, 2);
                    nodeEl.classList.replace('running', 'completed');

                    $("logContent").innerHTML += `
                        <div class="log-entry">
                            <div class="log-title">Agent @${nodeName}</div>
                            <code class="log-code" style="color: #10b981;">${aiRes}</code>
                        </div>`;
                }

                // Unified state update for all branches
                finalResultsMap[id] = resultData;
                levelResults.push(resultData);
                executed.add(id);
                
                if (pBar) pBar.style.width = ((executed.size / totalNodes) * 100) + "%";
                notify(`✅ Node @${nodeName} Completed`, 'success');

            } catch (e) {
                console.error("Execution error:", e);
                nodeEl.classList.remove('running');
                nodeEl.classList.add('failed');
                notify(`❌ Node @${nodeName} Failed`, 'error');
                if (pBar) pBar.style.background = "#ef4444";

                $("logContent").innerHTML += `
                    <div class="log-entry" style="border-left-color: #ef4444">
                        <div class="log-title text-danger">Node Failed: @${nodeName}</div>
                        <code class="log-code text-danger">${e.message}</code>
                    </div>`;
                
                executed.add(id); 
            }
        }
        levelResults.forEach(r => Object.assign(globalContext, r));
    }

    // 5. Finalize Progress Bar
    if (pBar) {
        pBar.style.width = "100%";
        pBar.style.background = "#10b981";
        setTimeout(() => { pContainer.style.display = "none"; }, 2500);
    }

    // 6. POST-SIMULATION SUMMARY
    const leafNodes = Object.keys(nodesData).filter(id => {
        return nodesData[id].outputs.output_1.connections.length === 0;
    });

    if (leafNodes.length > 0) {
        const reportContent = $("finalReportContent");
        reportContent.innerHTML = ""; 

        leafNodes.forEach(id => {
            const nodeData = nodesData[id].data;
            const nodeName = nodeData.nodeId || id;
            const nodeResult = finalResultsMap[id];
            
            let resultHtml = "";
            if (nodeResult) {
                // Prioritize rich snippet if it exists in the specific node result
                if (nodeResult.scenarioSnippet) {
                    resultHtml = nodeResult.scenarioSnippet;
                } else {
                    resultHtml = `<pre class="mb-0" style="font-size:12px">${JSON.stringify(nodeResult, null, 2)}</pre>`;
                }
            } else {
                resultHtml = `<div class="text-muted small">No result captured for this node.</div>`;
            }

            const section = document.createElement('div');
            section.className = "card mb-3 border-0 shadow-sm rounded-4";
            section.innerHTML = `
                <div class="card-header bg-white fw-bold text-primary border-0 pt-3 pb-0">
                   <i class="bi bi-check-circle-fill me-2"></i> Result: @${nodeName}
                </div>
                <div class="card-body">
                    <div class="p-3 bg-white border rounded-3 result-render-area">
                        ${resultHtml}
                    </div>
                </div>
            `;
            reportContent.appendChild(section);
        });

        const modalInstance = new bootstrap.Modal($('finalResultModal'));
        modalInstance.show();
    }
}



const callAI = async (prompt, schema) => {
    const apiKey = localStorage.getItem("v_api_key");
    if (!apiKey) {
        notify("Missing API Key! Please configure it in settings.", "error");
        throw new Error("API Key not found");
    }

    // Google AI Studio Endpoint (Standard Gemini API)
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${apiKey}`;

    const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            "generationConfig": { 
                "temperature": 0.1, 
                "responseMimeType": "application/json", 
                "responseSchema": schema 
            },
            "contents": [{ 
                "role": "user", 
                "parts": [{"text": prompt}] 
            }]
        })
    });

    if (!r.ok) {
        const err = await r.json();
        throw new Error(err.error?.message || "AI Request Failed");
    }

    const d = await r.json();
    return d.candidates[0].content.parts[0].text;
};

function importFromOriginalSchema(json) {
    if (!json.nodes) return;
    editor.clear();
    
    const idMap = {};
    const levels = {};
    const parentsOf = {}; // Track who points to whom

    // 1. Initialize mapping
    json.nodes.forEach(n => {
        levels[n.id] = 0;
        parentsOf[n.id] = [];
    });

    // 2. Build dependency map and calculate levels (X-axis)
    (json.links || []).forEach(l => {
        parentsOf[l.toNodeId].push(l.fromNodeId);
    });

    // Determine horizontal level (Rank)
    for (let i = 0; i < json.nodes.length; i++) {
        (json.links || []).forEach(l => {
            levels[l.toNodeId] = Math.max(levels[l.toNodeId], levels[l.fromNodeId] + 1);
        });
    }

    const counts = {};
    const nodePositions = {}; // Store {x, y} to reference for children

    // 3. Sort nodes by level so we process parents before children
    const sortedNodes = [...json.nodes].sort((a, b) => levels[a.id] - levels[b.id]);

    sortedNodes.forEach(n => {
        const lvl = levels[n.id];
        const parents = parentsOf[n.id];
        
        let xPos = 100 + (lvl * 380);
        let yPos;

        if (lvl === 0) {
            // Root level: Just stack them
            counts[lvl] = (counts[lvl] || 0) + 1;
            yPos = 100 + (counts[lvl] * 220);
        } else {
            // Child level: Center based on parent average Y
            const parentYSum = parents.reduce((sum, pId) => sum + nodePositions[pId].y, 0);
            const avgY = parentYSum / parents.length;
            
            // To prevent overlap if multiple children share parents:
            counts[lvl] = (counts[lvl] || 0) + 1;
            yPos = avgY + ((counts[lvl] - 1) * 50); // Minimal offset if stacked
        }

        nodePositions[n.id] = { x: xPos, y: yPos };

        const nodeData = buildNodeData(n);
        const nodeClass = nodeData.isScriptOnly ? "logic-node" : (nodeData.apiCall ? "api-node" : "agent");

        idMap[n.id] = editor.addNode(
            nodeClass, 1, 1, xPos, yPos, nodeClass, nodeData, htmlOf(nodeData)
        );
    });

    // 4. Restore connections
    (json.links || []).forEach(l => { 
        if (idMap[l.fromNodeId] && idMap[l.toNodeId]) {
            editor.addConnection(idMap[l.fromNodeId], idMap[l.toNodeId], "output_1", "input_1"); 
        }
    });
}

// Helper to keep the import function clean

function buildNodeData(n) {
    const resolver = n.resolver || {};
    const inline = resolver.inline || {};
    let data = { nodeId: n.id };

    if (inline.apiCall || resolver.apiCall) {
        data.apiCall = inline.apiCall || resolver.apiCall;
    } else if (inline.script || resolver.script) {
      
        data.script = inline.script.code;
        data.transformer = resolver.inputTransformer.code;
        data.isScriptOnly = true;
    } else {
        data.prompt = inline.aiPrompt?.promptTemplate;
        data.schema = inline.aiPrompt?.responseFormat?.json?.schema;
        data.transformer = resolver.inputTransformer?.code || "($)";
    }
    return data;
}

    ${currentExpression}
    """

    FORMATTING RULES:
    1. READABILITY: Use multiple lines. Do NOT return a single-line string.
    2. INDENTATION: Use 2 spaces for nested objects.
    3. SEMICOLONS: Place each variable assignment on its own line followed by a semicolon.
    4. PRESERVE LOGIC: Keep existing transformations ($number, $lookup, etc.).
    
    The structure should look exactly like this:
    (
      $inputPrompt := [
        { "claim": claim },
        \`node-1\`,
        \`node-2\`
      ] ~> $merge;
      { "inputPrompt": $inputPrompt }
    )
`;

    try {
        const r = await callAI(mapInstruction, mapSchema);
        const parsed = JSON.parse(r);
        
        // 4. Update the Ace Editor with the merged logic
        transformerAce.setValue(parsed.jsonata_expression, -1);
validateJSONata(parsed.jsonata_expression); // Immediate proof check
notify("Mapping synced and validated", "success");
        
        
    } catch (e) {
        console.error("Mapping Sync failed:", e);
        notify("AI Sync failed: Upstream graph too complex or no parents found", "error");
    } finally {
        $("editorAiLoader").style.display = 'none';
    }
};

    if ($("editorAiLoader")) $("editorAiLoader").style.display = 'flex';

    try {
        const nodeSchema = {
            type: "object",
            properties: {
                nodeId: { type: "string" },
                prompt: { type: "string" },
                schema: { type: "object" }
            },
            required: ["nodeId", "prompt", "schema"]
        };

        const result = await callAI(`Build an agent for: "${goal}"`, nodeSchema);
        const data = JSON.parse(result);
        
        // Add to canvas
        editor.addNode("agent", 1, 1, 150, 150, "agent", { ...data, transformer: "($)" }, htmlOf(data));
